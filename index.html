@layer base {
  html, body, #root {
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;

  body {

    color: #f1f5f9;

}

  background: #1e293b;
  border-radius: 9999px;
}

::-webkit-scrollbar-thumb:hover {
  background: #006a4e;
}

.vis-network {
  outline: none;
}

er-rose-500/40",icon:"\u2694\uFE0F",description:"Pivotal movements, national struggle, founding figures, and historic independence milestones."},Culture:{name:"Culture",bengaliName:"\u09B8\u0982\u09B8\u09CD\u0995\u09C3\u09A4\u09BF \u0993 \u09B8\u09BE\u09B9\u09BF\u09A4\u09CD\u09AF",color:"#D97706",borderColor:"#F59E0B",highlightColor:"#FDE68A",bgTailwind:"bg-amber-500/15",textTailwind:"text-amber-400",borderTailwind:"border-amber-500/40",icon:"\u{1F3A8}",description:"Literature, UNESCO intangible heritage, folk traditions, music, visual arts, and festivals."},Science:{name:"Science",bengaliName:"\u09AC\u09BF\u099C\u09CD\u099E\u09BE\u09A8 \u0993 \u0997\u09AC\u09C7\u09B7\u09A3\u09BE",color:"#0284C7",borderColor:"#06B6D4",highlightColor:"#BAE6FD",bgTailwind:"bg-cyan-500/15",textTailwind:"text-cyan-400",borderTailwind:"border-cyan-500/40",icon:"\u269B\uFE0F",description:"Theoretical physics, botanical biophysics, world-ranking universities, and Nobel-winning social innovation."},Geography:{name:"Geography",bengaliName:"\u09AD\u09C2\u0997\u09CB\u09B2 \u0993 \u0990\u09A4\u09BF\u09B9\u09CD\u09AF",color:"#059669",borderColor:"#10B981",highlightColor:"#A7F3D0",bgTailwind:"bg-emerald-500/15",textTailwind:"text-emerald-400",borderTailwind:"border-emerald-500/40",icon:"\u{1F33F}",description:"Mangrove deltas, majestic riverways, ancient Mughal & Buddhist monuments, and marine biodiversity."}},zs=[{id:"sheikh-mujibur-rahman",label:"Sheikh Mujibur Rahman",bengaliLabel:"\u09B6\u09C7\u0996 \u09AE\u09C1\u099C\u09BF\u09AC\u09C1\u09B0 \u09B0\u09B9\u09AE\u09BE\u09A8",category:"History",era:"1920\u20131975",location:"Tungipara, Gopalganj",description:`Architect of Bangladesh's independence, charismatic leader of the Awami League, affectionately revered as "Bangabandhu" (Friend of Bengal). Delivered the historic 7th March address and served as the nation's founding leader.`,attributes:{Role:"Father of the Nation & 1st President",Lifespan:"17 March 1920 \u2013 15 August 1975","Key Address":"Historic 7th March 1971 Speech",Milestones:"Six Point Movement (1966), Declaration of Independence (1971)"},tags:["Bangabandhu","Independence","Awami League","Liberation War","Statesman"],icon:"\u{1F3DB}\uFE0F"},{id:"historic-7th-march",label:"Historic 7th March Speech",bengaliLabel:"\u09ED\u0987 \u09AE\u09BE\u09B0\u09CD\u099A\u09C7\u09B0 \u09AD\u09BE\u09B7\u09A3",category:"History",era:"March 7, 1971",location:"Suhrawardy Udyan (Racecourse Ground), Dhaka",description:'Electrifying 19-minute address by Sheikh Mujibur Rahman to over two million people calling for civil disobedience and armed preparedness: "The struggle this time is the struggle for our emancipation; the struggle this time is the struggle for independence."',attributes:{Date:"7 March 1971",Speaker:"Sheikh Mujibur Rahman","UNESCO Heritage":"Inscribed into Memory of the World Register (2017)",Impact:"De facto proclamation of sovereign self-determination"},tags:["UNESCO","Speech","Resistance","Memory of the World"],unesco:!0,icon:"\u{1F4DC}"},{id:"language-movement-1952",label:"Language Movement 1952",bengaliLabel:"\u09AD\u09BE\u09B7\u09BE \u0986\u09A8\u09CD\u09A6\u09CB\u09B2\u09A8 (\u09E7\u09EF\u09EB\u09E8)",category:"History",era:"1948\u20131952 (Peak: 21 Feb 1952)",location:"Dhaka",description:"Monumental cultural and political struggle asserting Bengali as an official state language of Pakistan. The sacrifice of students on 21 February sparked secular nationalist consciousness and led UNESCO to declare Feb 21 as International Mother Language Day.",attributes:{"Peak Date":"21 February 1952","Key Martyrs":"Salam, Barkat, Rafiq, Jabbar, Shafiur","Global Milestone":"UNESCO International Mother Language Day (1999)",Legacy:"Cradle of modern secular Bengali identity"},tags:["Bengali Language","21 February","Martyrs","UNESCO","Catalyst"],unesco:!0,icon:"\u{1F5E3}\uFE0F"},{id:"liberation-war-1971",label:"Liberation War 1971",bengaliLabel:"\u09AE\u09B9\u09BE\u09A8 \u09AE\u09C1\u0995\u09CD\u09A4\u09BF\u09AF\u09C1\u09A6\u09CD\u09A7 (\u09E7\u09EF\u09ED\u09E7)",category:"History",era:"26 March \u2013 16 December 1971",location:"Nationwide & 11 Operational Sectors",description:"The nine-month patriotic armed conflict waged by the Mukti Bahini (guerrilla freedom fighters) and people of Bangladesh against the Pakistan Armed Forces, resulting in triumphant sovereign liberation on 16 December 1971.",attributes:{Duration:"9 Months (26 March \u2013 16 December 1971)","Armed Forces":"Mukti Bahini, Sector Commanders & Indian Allied Forces","Victory Day":"Bijoy Dibosh (16 December 1971)","Independence Day":"Shadhinota Dibosh (26 March 1971)"},tags:["Mukti Bahini","Sovereignty","Victory Day","Freedom Fighters"],icon:"\u2694\uFE0F"},{id:"shaheed-minar",label:"Central Shaheed Minar",bengaliLabel:"\u0995\u09C7\u09A8\u09CD\u09A6\u09CD\u09B0\u09C0\u09AF\u09BC \u09B6\u09B9\u09C0\u09A6 \u09AE\u09BF\u09A8\u09BE\u09B0",category:"History",era:"Erected 1952; Rebuilt 1963",location:"Dhaka Medical College & University of Dhaka area",description:"Iconic national monument designed by sculptor Hamidur Rahman with Novera Ahmed. The mother-and-fallen-children architectural motif symbolizes maternal pride and the unyielding sacrifice of the Language Movement martyrs.",attributes:{"Chief Sculptor":"Hamidur Rahman & Novera Ahmed",Symbolism:"Mother standing vigil over her martyred sons","Annual Ritual":"Prabhat Pheri barefoot procession on 21 February"},tags:["Monument","Language Martyrs","Architecture","Dhaka"],icon:"\u{1F5FC}"},{id:"national-martyrs-memorial",label:"National Martyrs' Memorial",bengaliLabel:"\u099C\u09BE\u09A4\u09C0\u09AF\u09BC \u09B8\u09CD\u09AE\u09C3\u09A4\u09BF\u09B8\u09CC\u09A7",category:"History",era:"Inaugurated 1982",location:"Savar, Dhaka",description:"The national monument honoring millions who sacrificed their lives during the 1971 Liberation War. Designed by Syed Mainul Hossain, composed of 7 interlocking triangular walls symbolizing 7 sequential epochs of national resistance.",attributes:{Architect:"Syed Mainul Hossain",Height:"45 meters (150 feet)",Symbolism:"7 historical struggles: 1952, 1954, 1956, 1962, 1966, 1969, 1971"},tags:["Memorial","Savar","Architecture","1971 Martyrs"],icon:"\u{1F53A}"},{id:"tajuddin-ahmad",label:"Tajuddin Ahmad",bengaliLabel:"\u09A4\u09BE\u099C\u0989\u09A6\u09CD\u09A6\u09C0\u09A8 \u0986\u09B9\u09AE\u09A6",category:"History",era:"1925\u20131975",location:"Kapasia, Gazipur",description:"First Prime Minister of Bangladesh and chief architect of the Mujibnagar provisional wartime government. Masterfully organized military sector commands, international refugee logistics, and diplomacy during the 1971 Liberation War.",attributes:{Role:"1st Prime Minister of Bangladesh (1971\u20131972)",Leadership:"Mujibnagar Wartime Cabinet",Education:"University of Dhaka (Economics & Law)"},tags:["Prime Minister","Mujibnagar","Diplomat","Wartime Leader"],icon:"\u{1F454}"},{id:"six-point-movement",label:"Six Point Movement 1966",bengaliLabel:"\u099B\u09AF\u09BC \u09A6\u09AB\u09BE \u0986\u09A8\u09CD\u09A6\u09CB\u09B2\u09A8 (\u09E7\u09EF\u09EC\u09EC)",category:"History",era:"1966",location:"Lahore & Dhaka",description:'The "Charter of Survival" (Mukti Shonod) formulated by Sheikh Mujibur Rahman, demanding complete regional federal autonomy, separate monetary accounts, and independent paramilitary forces for East Bengal.',attributes:{"Formulated By":"Sheikh Mujibur Rahman","Key Demand":"Federation of autonomous provinces",Significance:"Direct catalyst leading to the 1969 Mass Uprising and 1970 elections"},tags:["Six Points","Autonomy","Federalism","Political Charter"],icon:"\u{1F4D1}"},{id:"rabindranath-tagore",label:"Rabindranath Tagore",bengaliLabel:"\u09B0\u09AC\u09C0\u09A8\u09CD\u09A6\u09CD\u09B0\u09A8\u09BE\u09A5 \u09A0\u09BE\u0995\u09C1\u09B0",category:"Culture",era:"1861\u20131941",location:"Shilaidaha (Kushtia), Patisar (Naogaon), Shahjadpur",description:`Universal Bengali polymath and Asia's first Nobel Laureate (Literature, 1913). Composed the national anthem of Bangladesh, "Amar Sonar Bangla". Deeply inspired by Lalon Shah and rural folk mysticism while managing estates in Shilaidaha, Kushtia.`,attributes:{"Nobel Prize":"Literature (1913, Gitanjali)","National Anthem":"Amar Sonar Bangla (Composed 1905)","Bangladesh Residence":"Shilaidaha Kuthibari, Kushtia & Patisar","Close Confidant":"Sir Jagadish Chandra Bose"},tags:["Nobel Laureate","Polymath","Amar Sonar Bangla","Literature","Poet"],icon:"\u{1F58B}\uFE0F"},{id:"kazi-nazrul-islam",label:"Kazi Nazrul Islam",bengaliLabel:"\u0995\u09BE\u099C\u09C0 \u09A8\u099C\u09B0\u09C1\u09B2 \u0987\u09B8\u09B2\u09BE\u09AE",category:"Culture",era:"1899\u20131976",location:"Dhaka (Mausoleum at DU Mosque)",description:'The "Rebel Poet" (Bidrohi Kobi) and National Poet of Bangladesh. Penned fierce anti-colonial, egalitarian, and syncretic poetry. Composed over 4,000 Nazrul Geeti songs blending classical ragas, folk tunes, and Islamic ghazals.',attributes:{"Official Title":"National Poet of Bangladesh","Seminal Poem":"Bidrohi (The Rebel, 1921)",Repatriated:"Brought to Dhaka in 1972 by Bangabandhu Sheikh Mujibur Rahman","Resting Place":"Adjacent to Dhaka University Central Mosque"},tags:["National Poet","Bidrohi","Music","Revolutionary","Secularism"],icon:"\u{1F525}"},{id:"lalon-shah",label:"Fakir Lalon Shah",bengaliLabel:"\u09AB\u0995\u09BF\u09B0 \u09B2\u09BE\u09B2\u09A8 \u09B6\u09BE\u09B9",category:"Culture",era:"c. 1774\u20131890",location:"Chheuriya, Kushtia",description:"Mystic saint, songwriter, philosopher, and supreme exponent of Baul spiritual music. Championed universal human equality above caste, religious sectarianism, and worldly division. Inscribed by UNESCO as Masterpiece of Oral and Intangible Heritage.",attributes:{"Spiritual Tradition":"Baul Mystic Philosophy","Shrine (Mazar)":"Lalon Akhra, Chheuriya, Kushtia","UNESCO Inscription":"Baul Songs (2005)",Philosophy:"Moner Manush (The Person within the Heart)"},tags:["Baul","UNESCO","Mystic","Folk Music","Philosophy","Kushtia"],unesco:!0,icon:"\u{1FA95}"},{id:"zainul-abedin",label:"Shilpacharya Zainul Abedin",bengaliLabel:"\u09B6\u09BF\u09B2\u09CD\u09AAacharya \u099C\u09AF\u09BC\u09A8\u09C1\u09B2 \u0986\u09AC\u09C7\u09A6\u09BF\u09A8",category:"Culture",era:"1914\u20131976",location:"Kishoreganj & Dhaka",description:'Revered as Shilpacharya ("Great Master of Arts"), founder of modern visual arts in Bangladesh. Globally celebrated for his raw, powerful Chinese-ink sketches documenting the devastating 1943 Bengal Famine. Founder of Dhaka Art College.',attributes:{Title:"Shilpacharya (Great Master of Arts)",Masterpieces:"Famine Sketches (1943), Nabanna (1969), Monpura 70",Founded:"Govt. College of Arts & Crafts (now DU Charukala, 1948)","Museum Founded":"Folk Art & Crafts Museum at Sonargaon"},tags:["Painting","Fine Arts","Bengal Famine","Sonargaon","Master Artist"],icon:"\u{1F3A8}"},{id:"jamdani-saree",label:"Jamdani Weaving",bengaliLabel:"\u099C\u09BE\u09AE\u09A6\u09BE\u09A8\u09BF \u09AC\u09AF\u09BC\u09A8 \u09B6\u09BF\u09B2\u09CD\u09AA",category:"Culture",era:"Mughal Golden Era to Present",location:"Shitalakshya River Basin, Narayanganj",description:"A vivid, translucent, figured muslin weaving craft handcrafted on traditional pit-looms. Woven using discontinuous extra-weft techniques passed down through generations of master weavers along the humid microclimate of the Shitalakshya river.",attributes:{"UNESCO Status":"Intangible Cultural Heritage of Humanity (2013)",Technique:"Discontinuous supplementary weft on handlooms",Epicenter:"Rupganj, Sonargaon, Narayanganj",Heritage:"Heir of ancient Dhaka Muslin"},tags:["UNESCO","Textile","Weaving","Muslin","Craftsmanship"],unesco:!0,icon:"\u{1F9F5}"},{id:"rickshaw-art",label:"Dhaka Rickshaw Art",bengaliLabel:"\u09A2\u09BE\u0995\u09BE\u09B0 \u09B0\u09BF\u0995\u09B6\u09BE \u0993 \u09B0\u09BF\u0995\u09B6\u09BE\u099A\u09BF\u09A4\u09CD\u09B0",category:"Culture",era:"1950s to Present",location:"Dhaka",description:"A dazzling neo-folk urban art tradition decorating three-wheeled cycle rickshaws with vivid oil-painted metal backplates, floral tassels, and hand-embossed tin panels featuring cinema stars, peacocks, river life, and utopian architecture.",attributes:{"UNESCO Status":"Intangible Cultural Heritage of Humanity (Inscribed Dec 2023)",Artisans:"Mistris (Chassis builders) & Rickshaw Painters",Medium:"Enamel paint on recycled tin plates and vinyl hoods"},tags:["UNESCO","Urban Art","Folk Art","Pop Culture","Dhaka"],unesco:!0,icon:"\u{1F6B2}"},{id:"pahela-baishakh",label:"Pahela Baishakh & Mangal Shobhajatra",bengaliLabel:"\u09AA\u09B9\u09C7\u09B2\u09BE \u09AC\u09C8\u09B6\u09BE\u0996 \u0993 \u09AE\u0999\u09CD\u0997\u09B2 \u09B6\u09CB\u09AD\u09BE\u09AF\u09BE\u09A4\u09CD\u09B0\u09BE",category:"Culture",era:"14 April (Annual Bengali New Year)",location:"Dhaka (Charukala, University of Dhaka)",description:"The secular festive celebration of the first day of the Bengali calendar. Highlights include the vibrant Mangal Shobhajatra (Procession of Well-being) bearing giant papier-m\xE2ch\xE9 masks of tigers, owls, birds, and folk symbols to ward off darkness.",attributes:{"UNESCO Status":"Intangible Cultural Heritage of Humanity (2016)",Organizers:"Faculty of Fine Arts (Charukala), University of Dhaka",Ritual:'Eating Panta Ilish, folk fairs, and singing "Esho He Baishakh"'},tags:["UNESCO","New Year","Carnival","Procession","Secular Festival"],unesco:!0,icon:"\u{1F3AD}"},{id:"nakshi-kantha",label:"Nakshi Kantha",bengaliLabel:"\u09A8\u0995\u09B6\u09C0 \u0995\u09BE\u0981\u09A5\u09BE",category:"Culture",era:"Centuries-old Folk Craft",location:"Jessore, Jamalpur, Rajshahi, Kushtia",description:"Traditional embroidered quilts stitched with layered soft vintage cotton saris using colorful running stitches. Each piece is a pictorial chronicle of rural folk tales, cosmological lotus mandalas, village weddings, and everyday dreams.",attributes:{"Literary Epiphany":`Jasimuddin's masterwork poem "Nakshi Kanthar Math" (1929)`,"Core Motifs":"Padma (Lotus), tree of life (Kalka), birds, palanquins",Artisans:"Rural women across greater Bengal"},tags:["Folk Craft","Embroidery","Textile","Jasimuddin","Heritage"],icon:"\u{1FAA1}"},{id:"satyendra-nath-bose",label:"Satyendra Nath Bose",bengaliLabel:"\u09B8\u09A4\u09CD\u09AF\u09C7\u09A8\u09CD\u09A6\u09CD\u09B0\u09A8\u09BE\u09A5 \u09AC\u09B8\u09C1",category:"Science",era:"1894\u20131974",location:"University of Dhaka / Kolkata",description:'Trailblazing theoretical physicist whose 1924 Dhaka University paper solved the radiation problem using novel quantum statistics, leading Albert Einstein to collaborate and establish Bose-Einstein Statistics. The fundamental subatomic particle "Boson" is named in his honor.',attributes:{"Dhaka Tenure":"Professor & Head of Physics Dept, University of Dhaka (1921\u20131945)",Discovery:"Bose-Einstein Statistics & Bose-Einstein Condensate","Namesake Particle":"Boson (coined by Paul Dirac)",Honor:"Fellow of the Royal Society (FRS, 1958)"},tags:["Theoretical Physics","Boson","Quantum Mechanics","Dhaka University","Einstein"],icon:"\u269B\uFE0F"},{id:"jagadish-chandra-bose",label:"Sir Jagadish Chandra Bose",bengaliLabel:"\u09B8\u09CD\u09AF\u09BE\u09B0 \u099C\u0997\u09A6\u09C0\u09B6 \u099A\u09A8\u09CD\u09A6\u09CD\u09B0 \u09AC\u09B8\u09C1",category:"Science",era:"1858\u20131937",location:"Rarikhal, Bikrampur (Munshiganj)",description:"Visionary polymath, physicist, botanist, and early science-fiction writer born in Bikrampur, Bangladesh. Pioneer of millimeter microwave radio optics and semiconductor radio detectors (predating Marconi) and inventor of the Crescograph for recording plant electro-physiology.",attributes:{Birthplace:"Rarikhal, Munshiganj, Bangladesh","Pioneering Tech":"Millimeter-wave optics (60 GHz) & Crescograph",Legacy:"Pioneer of biophysics, plant neurobiology, and radio research",Honor:"Fellow of the Royal Society (FRS, 1920)"},tags:["Radio Optics","Biophysics","Crescograph","Bikrampur","Polymath"],icon:"\u{1F4E1}"},{id:"university-of-dhaka",label:"University of Dhaka",bengaliLabel:"\u09A2\u09BE\u0995\u09BE \u09AC\u09BF\u09B6\u09CD\u09AC\u09AC\u09BF\u09A6\u09CD\u09AF\u09BE\u09B2\u09AF\u09BC",category:"Science",era:"Founded 1 July 1921",location:"Ramna & Nilkhet, Dhaka",description:`The oldest and flagship public university of Bangladesh, celebrated as the "Oxford of the East". The intellectual cradle that birthed the nation's democratic, scientific, literary, and sovereign statehood movements.`,attributes:{Established:"1 July 1921","Faculty & Alumni":"S.N. Bose, Bangabandhu, Muhammad Yunus, Zainul Abedin","Historic Milestone":"Center of 1952 Language Movement & 1971 Independence Proclamation"},tags:["University","Academia","Research","Intellectual Cradle","Dhaka"],icon:"\u{1F393}"},{id:"buet",label:"BUET",bengaliLabel:"\u09AC\u09BE\u0982\u09B2\u09BE\u09A6\u09C7\u09B6 \u09AA\u09CD\u09B0\u0995\u09CC\u09B6\u09B2 \u09AC\u09BF\u09B6\u09CD\u09AC\u09AC\u09BF\u09A6\u09CD\u09AF\u09BE\u09B2\u09AF\u09BC (\u09AC\u09C1\u09AF\u09BC\u09C7\u099F)",category:"Science",era:"Established 1962 (Origins 1876)",location:"Palashi, Dhaka",description:"Bangladesh University of Engineering and Technology, the apex institution for engineering, architecture, and urban planning. Its alumni engineered national infrastructure marvels like the Padma Bridge and global software breakthroughs.",attributes:{Type:"Apex Technical University",Origins:"Dhaka Survey School (1876)","Key Disciplines":"Civil Engineering, Computer Science, Architecture, Mechatronics"},tags:["Engineering","Technology","Architecture","Innovation","Dhaka"],icon:"\u2699\uFE0F"},{id:"jamal-nazrul-islam",label:"Prof. Jamal Nazrul Islam",bengaliLabel:"\u0985\u09A7\u09CD\u09AF\u09BE\u09AA\u0995 \u099C\u09BE\u09AE\u09BE\u09B2 \u09A8\u099C\u09B0\u09C1\u09B2 \u0987\u09B8\u09B2\u09BE\u09AE",category:"Science",era:"1939\u20132013",location:"Chittagong (CU RCMPS)",description:'Eminent mathematical physicist and cosmologist. Colleague of Stephen Hawking, Freeman Dyson, and Roger Penrose at Cambridge. Authored the seminal book "The Ultimate Fate of the Universe" and founded the Research Centre for Mathematical and Physical Sciences (RCMPS).',attributes:{"Core Field":"General Relativity & Theoretical Cosmology","Seminal Book":"The Ultimate Fate of the Universe (Cambridge University Press, 1983)","Cambridge Circle":"Close friend and research peer of Stephen Hawking",Institution:"RCMPS, University of Chittagong"},tags:["Cosmology","Relativity","Mathematics","Hawking Peer","Chittagong"],icon:"\u{1F30C}"},{id:"sir-fazle-hasan-abed",label:"Sir Fazle Hasan Abed",bengaliLabel:"\u09B8\u09CD\u09AF\u09BE\u09B0 \u09AB\u099C\u09B2\u09C7 \u09B9\u09BE\u09B8\u09BE\u09A8 \u0986\u09AC\u09C7\u09A6",category:"Science",era:"1936\u20132019",location:"Baniachong, Habiganj & Dhaka",description:"Visionary development pioneer who founded BRAC in 1972 initially to assist 1971 war returnees. Guided BRAC to become the world's largest NGO, pioneering community healthcare, oral rehydration therapy, girls' primary education, and Ultra-Poor Graduation programs globally.",attributes:{Organization:"BRAC (Founded 1972)","Global Scale":"Empowered over 100+ million people across Asia & Africa",Accolades:"World Food Prize (2015), Knight Commander of the Order of St Michael and St George (KCMG)"},tags:["Social Innovation","BRAC","Global Health","NGO","Education"],icon:"\u{1F310}"},{id:"muhammad-yunus",label:"Prof. Muhammad Yunus",bengaliLabel:"\u0985\u09A7\u09CD\u09AF\u09BE\u09AA\u0995 \u09AE\u09C1\u09B9\u09BE\u09AE\u09CD\u09AE\u09A6 \u0987\u0989\u09A8\u09C2\u09B8",category:"Science",era:"Born 28 June 1940",location:"Chittagong & Dhaka",description:"Economist, social entrepreneur, and Nobel Peace Prize Laureate (2006). Pioneered modern microcredit and the Grameen Bank model, extending collateral-free loans to millions of impoverished rural women. Serving as Chief Adviser of the interim government of Bangladesh.",attributes:{"Nobel Prize":"Nobel Peace Prize (2006 with Grameen Bank)",Concept:"Microcredit, Social Business & Three Zeros World","Alma Mater":"University of Dhaka & Vanderbilt University","Current Position":"Chief Adviser of Bangladesh"},tags:["Nobel Laureate","Microcredit","Grameen Bank","Economics","Social Business"],icon:"\u{1F3C5}"},{id:"kudrat-e-khuda",label:"Dr. Muhammad Qudrat-i-Khuda",bengaliLabel:"\u09A1. \u09AE\u09C1\u09B9\u09AE\u09CD\u09AE\u09A6 \u0995\u09C1\u09A6\u09B0\u09BE\u09A4-\u098F-\u0996\u09C1\u09A6\u09BE",category:"Science",era:"1900\u20131977",location:"Dhaka",description:"Distinguished organic chemist and educator. Founding director of PCSIR/BCSIR labs. Researched agricultural product valorization including extracting cellulose and paper pulp from jute sticks and isolating biochemicals from medicinal plants. Chaired Bangladesh's first National Education Commission.",attributes:{Field:"Organic Chemistry & Natural Product Chemistry",Founded:"BCSIR (Council of Scientific and Industrial Research)","National Role":"Chairman, 1974 National Education Commission"},tags:["Chemistry","BCSIR","Jute Science","Education Reform"],icon:"\u{1F9EA}"},{id:"sundarbans",label:"Sundarbans Mangrove Forest",bengaliLabel:"\u09B8\u09C1\u09A8\u09CD\u09A6\u09B0\u09AC\u09A8 \u09AE\u09CD\u09AF\u09BE\u09A8\u0997\u09CD\u09B0\u09CB\u09AD \u09AC\u09A8",category:"Geography",era:"Ancient Biosphere Delta",location:"Khulna, Bagerhat & Satkhira",description:"The world's largest contiguous mangrove wetland forest, blanketing over 10,000 square kilometers across the delta formed by the Ganges, Brahmaputra, and Meghna rivers. A UNESCO World Heritage Site, Ramsar wetland, and primary bastion of the Royal Bengal Tiger.",attributes:{"UNESCO Status":"Natural World Heritage Site (Inscribed 1997)",Ecology:"Intertidal mangrove swamps, mudflats, and Sundari trees","Total Area":"Approx. 10,000 sq km (60% located in Bangladesh)",Shield:"Protects coastal Bangladesh from catastrophic cyclones"},tags:["UNESCO","Mangrove","Ecosystem","Biodiversity","Ramsar"],unesco:!0,icon:"\u{1F405}"},{id:"royal-bengal-tiger",label:"Royal Bengal Tiger",bengaliLabel:"\u09B0\u09AF\u09BC\u09C7\u09B2 \u09AC\u09C7\u0999\u09CD\u0997\u09B2 \u099F\u09BE\u0987\u0997\u09BE\u09B0",category:"Geography",era:"National Animal",location:"Sundarbans Mangrove Delta",description:"The fierce and majestic national animal of Bangladesh (Panthera tigris tigris). Distinct for swimming across saline tidal creeks and flourishing in the dense, root-tangled mangrove canopy of the Sundarbans.",attributes:{"Scientific Name":"Panthera tigris tigris","National Symbol":"National Animal & Emblem of the Bangladesh Cricket Board",Habitat:"Sundarbans Mangrove Biosphere"},tags:["National Animal","Wildlife","Sundarbans","Conservation","Apex Predator"],icon:"\u{1F42F}"},{id:"padma-river",label:"Padma River",bengaliLabel:"\u09AA\u09A6\u09CD\u09AE\u09BE \u09A8\u09A6\u09C0",category:"Geography",era:"Major Transboundary Riverway",location:"Central & Southern Bangladesh",description:"The main distributary of the Ganges in Bangladesh, flowing southeast until meeting the Jamuna at Goalundo and the Meghna at Chandpur. Famed for its ferocious monsoon currents, the sweetest Hilsa (Ilish) fish, and the engineering marvel Padma Bridge.",attributes:{Length:"120 km (Within Bangladesh)",Infrastructure:"Padma Multipurpose Bridge (6.15 km double-deck rail-road)","Cultural Ecology":`Silver Hilsa (Ilish) fishery & inspiration for Tarasankar Bandyopadhyay's "Padma Nadir Majhi"`},tags:["River","Waterway","Delta","Hilsa","Padma Bridge"],icon:"\u{1F30A}"},{id:"coxs-bazar",label:"Cox's Bazar Beach",bengaliLabel:"\u0995\u0995\u09CD\u09B8\u09AC\u09BE\u099C\u09BE\u09B0 \u09B8\u09AE\u09C1\u09A6\u09CD\u09B0 \u09B8\u09C8\u0995\u09A4",category:"Geography",era:"Natural Maritime Coast",location:"Cox's Bazar, Chittagong Division",description:"The longest unbroken natural sand beach in the world, stretching over 120 uninterrupted kilometers along the Bay of Bengal. Named after 18th-century British administrator Captain Hiram Cox, it is the maritime tourism crown of Bangladesh.",attributes:{"World Record":"Longest natural unbroken sandy beach (120+ km)","Water Body":"Bay of Bengal","Key Points":"Laboni Point, Sugandha, Inani Beach (Coral stones), Himchari"},tags:["Beach","World Record","Bay of Bengal","Tourism","Coastline"],icon:"\u{1F3D6}\uFE0F"},{id:"lalbagh-fort",label:"Lalbagh Fort",bengaliLabel:"\u09B2\u09BE\u09B2\u09AC\u09BE\u0997 \u0995\u09C7\u09B2\u09CD\u09B2\u09BE",category:"Geography",era:"1678 (17th Century Mughal)",location:"Lalbagh, Old Dhaka",description:"An incomplete 17th-century Mughal fortress palace complex built by Prince Muhammad Azam and completed by Nawab Shaista Khan along the Buriganga river. Houses the graceful marble Mausoleum of Pari Bibi, the Diwan-i-Aam bathhouse, and a three-domed mosque.",attributes:{Founder:"Prince Muhammad Azam (1678) & Shaista Khan","Key Monument":"Mausoleum of Bibi Pari (Iran Dukht)",Architecture:"Classic Mughal Charbagh garden symmetry"},tags:["Mughal","Old Dhaka","Fortress","Heritage","Architecture"],icon:"\u{1F3F0}"},{id:"ahsan-manzil",label:"Ahsan Manzil",bengaliLabel:"\u0986\u09B9\u09B8\u09BE\u09A8 \u09AE\u099E\u09CD\u099C\u09BF\u09B2 (\u0997\u09CB\u09B2\u09BE\u09AA\u09BF \u09AA\u09CD\u09B0\u09BE\u09B8\u09BE\u09A6)",category:"Geography",era:"Built 1859\u20131872",location:"Kumartoli, Buriganga Riverbank, Old Dhaka",description:'The monumental "Pink Palace" on the Buriganga river, former official residential palace and seat of the Nawabs of Dhaka. In 1906, Nawab Salimullah hosted the foundational conference here that led to the creation of the All-India Muslim League.',attributes:{Style:"Indo-Saracenic Revival Architecture","Historical Nexus":"Founding venue of All-India Muslim League (1906)","Current Role":"National Museum of the Dhaka Nawabi Era"},tags:["Palace","Old Dhaka","Museum","Indo-Saracenic","Nawab"],icon:"\u{1F3DB}\uFE0F"},{id:"srimangal",label:"Srimangal & Lawachara",bengaliLabel:"\u09B6\u09CD\u09B0\u09C0\u09AE\u0999\u09CD\u0997\u09B2 \u0993 \u09B2\u09BE\u0989\u09AF\u09BC\u09BE\u099B\u09A1\u09BC\u09BE",category:"Geography",era:"Tea plantations since 1854",location:"Moulvibazar, Sylhet Division",description:"The Tea Capital of Bangladesh, carpeted with undulating green tea estates, rubber plantations, and the Lawachara National Park tropical rainforest\u2014home to the critically endangered Western Hoolock Gibbon and diverse indigenous communities.",attributes:{Title:"Tea Capital of Bangladesh",Ecosystem:"Lawachara Semi-evergreen Rainforest",Fauna:"Western Hoolock Gibbon, Slow Loris, Phayre's Leaf Monkey",Specialty:"Famed Seven-Layer Tea and tea garden hospitality"},tags:["Tea Capital","Sylhet","Rainforest","Gibbon","Eco-Tourism"],icon:"\u{1F343}"},{id:"st-martins-island",label:"St. Martin's Island",bengaliLabel:"\u09B8\u09C7\u09A8\u09CD\u099F \u09AE\u09BE\u09B0\u09CD\u099F\u09BF\u09A8\u09CD\u09B8 \u09A6\u09CD\u09AC\u09C0\u09AA (\u09A8\u09BE\u09B0\u09BF\u0995\u09C7\u09B2 \u099C\u09BF\u099E\u09CD\u099C\u09BF\u09B0\u09BE)",category:"Geography",era:"Marine Coral Formations",location:"Bay of Bengal (9 km south of Teknaf)",description:'The only coral reef island in Bangladesh, affectionately known as "Narikel Jinjira" (Coconut Island). A crystalline marine sanctuary teeming with living corals, algae, and critical nesting beaches for endangered Olive Ridley sea turtles.',attributes:{"Local Name":"Narikel Jinjira (Coconut Island)",Geology:"Sedimentary coral and coquina limestone formation",Wildlife:"Olive Ridley sea turtles & Indo-Pacific reef fish"},tags:["Coral Island","Bay of Bengal","Marine Sanctuary","Teknaf"],icon:"\u{1F3DD}\uFE0F"},{id:"paharpur",label:"Somapura Mahavihara at Paharpur",bengaliLabel:"\u09B8\u09CB\u09AE\u09AA\u09C1\u09B0 \u09AE\u09B9\u09BE\u09AC\u09BF\u09B9\u09BE\u09B0 (\u09AA\u09BE\u09B9\u09BE\u09A1\u09BC\u09AA\u09C1\u09B0)",category:"Geography",era:"8th Century CE (Pala Empire)",location:"Badalgachhi, Naogaon",description:"UNESCO World Heritage Site, one of the greatest Buddhist monastic learning centers in ancient Asia. Commissioned by Pala emperor Dharmapala, its cruciform stupa architecture profoundly inspired Southeast Asian temples such as Angkor Wat and Pagan.",attributes:{"UNESCO Status":"Cultural World Heritage Site (Inscribed 1985)",Builder:"Second Pala King Dharmapala (c. 781\u2013821 CE)",Scale:"Largest Buddhist Vihara south of the Himalayas (177 monastic cells)"},tags:["UNESCO","Pala Dynasty","Ancient Buddhist","Architecture","Archaeology"],unesco:!0,icon:"\u{1F6D5}"}],_s=[{id:"e1",from:"sheikh-mujibur-rahman",to:"liberation-war-1971",label:"PROCLAIMED_INDEPENDENCE_OF",description:"Proclaimed sovereign independence on 26 March 1971, serving as Supreme Commander in spirit."},{id:"e2",from:"sheikh-mujibur-rahman",to:"historic-7th-march",label:"DELIVERED",description:"Delivered the UNESCO-inscribed address uniting the nation for liberation."},{id:"e3",from:"sheikh-mujibur-rahman",to:"six-point-movement",label:"AUTHORED_CHARTER",description:"Presented the Six Points in 1966 as the Bengali charter of survival."},{id:"e4",from:"sheikh-mujibur-rahman",to:"university-of-dhaka",label:"STUDIED_LAW_AT",description:"Studied law at University of Dhaka and founded the East Pakistan Muslim Students League."},{id:"e5",from:"sheikh-mujibur-rahman",to:"tajuddin-ahmad",label:"CLOSE_ALLIED_LEADERS",description:"Formed the leadership duo driving the independence struggle and interim government."},{id:"e6",from:"sheikh-mujibur-rahman",to:"kazi-nazrul-islam",label:"REPATRIATED_AND_HONORED",description:"Arranged poet Nazrul's repatriation from Kolkata to Dhaka in 1972 as Bangladesh's National Poet."},{id:"e7",from:"historic-7th-march",to:"liberation-war-1971",label:"CATALYZED_STRUGGLE",description:"Mobilized mass civil resistance into an armed liberation struggle."},{id:"e8",from:"tajuddin-ahmad",to:"liberation-war-1971",label:"LED_PROVISIONAL_GOVT",description:"Formed the Mujibnagar provisional cabinet in exile and coordinated 11 war sectors."},{id:"e9",from:"liberation-war-1971",to:"national-martyrs-memorial",label:"COMMEMORATED_BY",description:"Honored at the seven-spired Savar monument designed by Syed Mainul Hossain."},{id:"e10",from:"six-point-movement",to:"liberation-war-1971",label:"POLITICAL_FOUNDATION",description:"Laid the ideological and popular foundation for sovereign break from Pakistan."},{id:"e11",from:"rabindranath-tagore",to:"liberation-war-1971",label:"ANTHEM_INSPIRED_SOLDIERS",description:`Tagore's "Amar Sonar Bangla" served as the rallying anthem for freedom fighters.`},{id:"e12",from:"sir-fazle-hasan-abed",to:"liberation-war-1971",label:"RESPONDED_TO_REFUGEE_CRISIS",description:"Founded BRAC in 1972 directly to resettle 10 million displaced war refugees."},{id:"e13",from:"zainul-abedin",to:"liberation-war-1971",label:"DOCUMENTED_RESISTANCE",description:"Captured the struggle and famine spirit in revolutionary brushwork."},{id:"e14",from:"language-movement-1952",to:"shaheed-minar",label:"COMMEMORATED_BY",description:"Shaheed Minar stands as the enduring monument to the 21 February martyrs."},{id:"e15",from:"language-movement-1952",to:"university-of-dhaka",label:"STUDENT_EPICENTER",description:"Dhaka University students defied Section 144 on 21 Feb 1952, igniting the movement."},{id:"e16",from:"language-movement-1952",to:"liberation-war-1971",label:"SEEDBED_OF_NATIONHOOD",description:"The Language Movement established the secular Bengali consciousness that led to 1971."},{id:"e17",from:"shaheed-minar",to:"university-of-dhaka",label:"LOCATED_ON_CAMPUS",description:"Situated in the central medical college / university heartland of Dhaka."},{id:"e18",from:"rabindranath-tagore",to:"lalon-shah",label:"INFLUENCED_BY_MYSTICISM",description:"Tagore collected and was deeply transformed by Lalon's universalist Baul philosophy."},{id:"e19",from:"rabindranath-tagore",to:"jagadish-chandra-bose",label:"LIFELONG_INTELLECTUAL_PEER",description:"Tagore and J.C. Bose maintained an intimate 40-year intellectual friendship and patronage."},{id:"e20",from:"rabindranath-tagore",to:"padma-river",label:"COMPOSED_ALONG_BANKS",description:"Composed much of Gitanjali and Galpaguchchha while sailing in houseboats on the Padma."},{id:"e21",from:"kazi-nazrul-islam",to:"university-of-dhaka",label:"RESTING_PLACE_AND_D.LITT",description:"Awarded honorary D.Litt by DU in 1974 and buried beside the university mosque."},{id:"e22",from:"zainul-abedin",to:"university-of-dhaka",label:"FOUNDED_FINE_ARTS_FACULTY",description:"Founded the Institute of Arts (Charukala) in 1948, now DU's Faculty of Fine Arts."},{id:"e23",from:"zainul-abedin",to:"nakshi-kantha",label:"PRESERVED_FOLK_TRADITION",description:"Championed folk textiles and established the Folk Art Museum in Sonargaon."},{id:"e24",from:"pahela-baishakh",to:"university-of-dhaka",label:"MANGAL_SHOBHAJATRA_BIRTHPLACE",description:"The UNESCO-inscribed procession was birthed at Charukala, University of Dhaka."},{id:"e25",from:"rickshaw-art",to:"university-of-dhaka",label:"ICONIC_CAMPUS_CULTURE",description:"Rickshaws are the primary campus transit and colorful visual fabric of Dhaka University."},{id:"e26",from:"rickshaw-art",to:"lalbagh-fort",label:"HERITAGE_OF_OLD_DHAKA",description:"Old Dhaka's Lalbagh and Islampur lanes are the traditional workshop hubs for rickshaw art."},{id:"e27",from:"jamdani-saree",to:"padma-river",label:"SHITALAKSHYA_DELTA_CRAFT",description:"Woven along the Shitalakshya river basin, part of the greater Padma-Meghna delta."},{id:"e28",from:"lalon-shah",to:"nakshi-kantha",label:"SHARED_RURAL_FOLK_ROOTS",description:"Both express the spiritual and domestic soul of rural Bengal folk heritage."},{id:"e29",from:"jagadish-chandra-bose",to:"satyendra-nath-bose",label:"MENTORED_AND_INSPIRED",description:"Sir J.C. Bose taught and inspired S.N. Bose at Presidency and Bengal scientific societies."},{id:"e30",from:"satyendra-nath-
